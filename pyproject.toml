[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thelibrarian"
version = "0.1.0"
description = "Safety-first local file organizer"
requires-python = ">=3.11"

[project.optional-dependencies]
online = []
ollama = []
web = []
dev = []

[project.scripts]
thelibrarian = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
